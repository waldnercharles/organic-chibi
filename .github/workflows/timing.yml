name: timing

on:
  push:
    branches: [claude-research]
    paths:
      - "src/**"
      - "translate/**"
      - "vendor/**"
      - "experiments/arm64-backend/**"
      - "experiments/check-bodies/gen.py"
      - ".github/workflows/timing.yml"
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  time:
    strategy:
      fail-fast: false
      matrix:
        os: [xcode-27, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install tools (arm64 Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-20
          echo /usr/lib/llvm-20/bin >> "$GITHUB_PATH"
          sudo sysctl kernel.perf_event_paranoid=2

      - name: Show the machine
        run: |
          {
            echo "### ${{ matrix.os }}"
            echo
            echo '```'
            clang --version | head -1
            if [ "$RUNNER_OS" = macOS ]; then
              sw_vers -productVersion
              sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
            else
              lscpu | grep -E '^(Model name|CPU\(s\))'
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Time this commit
        run: |
          bash experiments/arm64-backend/time-switch.sh . "$RUNNER_TEMP/head" 15 41 | tee "$RUNNER_TEMP/head.txt"
          {
            echo "${GITHUB_SHA::7}:"
            echo
            echo '```'
            sed -n '/^== result/,$p' "$RUNNER_TEMP/head.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Time the commits the owner timed on the M4 Pro
        if: runner.os == 'macOS'
        run: |
          time_reference() {
            mkdir "$RUNNER_TEMP/tree-$1"
            git archive "$1" | tar -x -C "$RUNNER_TEMP/tree-$1"
            bash experiments/arm64-backend/time-switch.sh "$RUNNER_TEMP/tree-$1" "$RUNNER_TEMP/time-$1" 15 41 | tee "$RUNNER_TEMP/$1.txt"
            {
              echo "${1::7}, which on the M4 Pro with Apple clang 21 took $2 translated:"
              echo
              echo '```'
              sed -n '/^== result/,$p' "$RUNNER_TEMP/$1.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          }
          time_reference 28909a4e98fa46c0e136f30a913e8828a1c1c798 "5.8% more cycles and 7.6% more instructions"
          time_reference 2b0c6d496077666eb993341daf751dbb96ecead4 "1.5% more cycles and 3.4% more instructions"
